<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="外貨換算">
<meta name="theme-color" content="#f8f9fa">
<title>外貨換算・見積アプリ</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 15px;
    line-height: 1.6;
    background-color: #f8f9fa;
    color: #333;
    max-width: 680px;
    margin: 0 auto;
  }
  h2 { font-size: 1.4em; color: #000; border-left: 5px solid #007bff; padding-left: 10px; margin-bottom: 15px; }
  h3 { font-size: 1.1em; margin-top: 20px; margin-bottom: 8px; color: #444; }
  label { display: block; font-weight: bold; font-size: 0.85em; margin-bottom: 3px; color: #555; }
  input, select {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    margin-bottom: 10px;
  }
  input:focus, select:focus { outline: none; border-color: #007bff; }
  button {
    padding: 10px 15px;
    font-size: 15px;
    border-radius: 6px;
    border: none;
    background-color: #e0e0e0;
    cursor: pointer;
    margin: 3px 2px;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.2s;
  }
  button:active { opacity: 0.7; }
  .btn-primary   { background-color: #007bff; color: white; font-weight: bold; }
  .btn-success   { background-color: #28a745; color: white; }
  .btn-danger    { background-color: #dc3545; color: white; }
  .btn-secondary { background-color: #6c757d; color: white; }
  .btn-warning   { background-color: #fd7e14; color: white; font-weight: bold; }
  .btn-info      { background-color: #17a2b8; color: white; font-weight: bold; }
  .btn-full { width: 100%; margin-top: 5px; }

  .card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
  }

  .rate-display {
    background: #e8f4fd;
    border: 1px solid #bee5eb;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 0.88em;
    margin-bottom: 10px;
    line-height: 1.8;
  }
  .rate-display span { font-weight: bold; color: #0056b3; }

  .group-block {
    border: 2px solid #007bff;
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .group-header {
    background: #007bff;
    color: white;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    font-size: 0.95em;
  }
  .group-body { padding: 12px; }

  .detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9em;
    margin-top: 4px;
  }
  .detail-table th {
    background: #f0f4f8;
    padding: 8px 10px;
    text-align: left;
    font-size: 0.82em;
    color: #555;
    border-bottom: 1px solid #ddd;
  }
  .detail-table td {
    padding: 8px 6px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
  }
  .detail-table tr:last-child td { border-bottom: none; }
  .detail-table input { margin-bottom: 0; padding: 7px 8px; font-size: 15px; }
  .subtotal-cell { text-align: right; font-weight: bold; color: #d63384; white-space: nowrap; min-width: 110px; }
  .label-cell    { white-space: nowrap; color: #333; font-weight: bold; min-width: 80px; }
  .unit-cell     { color: #888; font-size: 0.82em; white-space: nowrap; min-width: 60px; }

  .section-label {
    font-size: 0.78em;
    font-weight: bold;
    color: #fff;
    background: #6c757d;
    padding: 3px 10px;
    border-radius: 3px;
    margin: 10px 0 4px;
    display: inline-block;
  }
  .section-label.expense { background: #fd7e14; }

  .group-subtotal {
    text-align: right;
    font-weight: bold;
    font-size: 0.95em;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 2px solid #ddd;
    color: #333;
  }
  .group-subtotal .jpy { color: #d63384; font-size: 1.1em; }

  /* ✅ 依頼先タブ（明細入力欄内） */
  .agency-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .agency-tabs button {
    flex: 1;
    padding: 8px;
    font-size: 14px;
    background: #e0e0e0;
    color: #333;
    border-radius: 6px;
    border: 2px solid transparent;
    font-weight: bold;
  }
  .agency-tabs button.active {
    background: #28a745;
    color: white;
    border-color: #1e7e34;
  }

  .rate-type-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .rate-type-tabs button {
    flex: 1;
    padding: 8px;
    font-size: 14px;
    background: #e0e0e0;
    color: #333;
    border-radius: 6px;
    border: 2px solid transparent;
    font-weight: bold;
  }
  .rate-type-tabs button.active {
    background: #007bff;
    color: white;
    border-color: #0056b3;
  }

  /* ── 簡易換算欄 ── */
  .quick-calc {
    background: #f0f4f8;
    border: 1px solid #d0dbe8;
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 12px;
  }
  .quick-calc-label {
    font-size: 0.82em;
    font-weight: bold;
    color: #555;
    margin-bottom: 8px;
  }
  .quick-calc-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .quick-calc-row input {
    flex: 2;
    margin-bottom: 0;
    font-size: 16px;
    padding: 10px;
  }
  .quick-calc-row select {
    flex: 1;
    margin-bottom: 0;
    font-size: 16px;
    padding: 10px;
  }
  .quick-calc-arrow {
    color: #888;
    font-size: 1.2em;
    flex-shrink: 0;
  }
  .quick-calc-result {
    flex: 2;
    font-size: 1.15em;
    font-weight: bold;
    color: #d63384;
    text-align: right;
    white-space: nowrap;
  }
  .quick-calc-result.no-rate {
    color: #aaa;
    font-size: 0.9em;
    font-weight: normal;
  }
  .quick-calc-rate-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
  }
  .quick-calc-rate-row input {
    flex: 1;
    font-family: monospace;
    font-size: 0.88em;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    color: #333;
    cursor: pointer;
    margin-bottom: 0;
    caret-color: transparent;
    min-width: 0;
  }
  .quick-calc-rate-row input:focus {
    border-color: #007bff;
    outline: none;
    background: #e8f4fd;
  }
  .quick-calc-rate-row input.copied {
    background: #d4edda;
    border-color: #28a745;
    transition: background 0.15s;
  }
  .quick-calc-rate-row input.disabled-look {
    background: #f8f8f8;
    color: #aaa;
    cursor: not-allowed;
  }
  .quick-calc-rate-row button {
    padding: 7px 10px;
    font-size: 13px;
    white-space: nowrap;
    background: #6c757d;
    color: white;
    border-radius: 6px;
    border: none;
    flex-shrink: 0;
    margin: 0;
    cursor: pointer;
    opacity: 1;
  }
  .quick-calc-rate-row button.is-disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .quick-clear-btn {
    padding: 9px 12px;
    font-size: 14px;
    background: #e0e0e0;
    color: #555;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    margin: 0;
    white-space: nowrap;
  }
  .quick-clear-btn:active { opacity: 0.7; }

  /* ── 比較表示エリア ── */
  .compare-area {
    display: none;
    margin-top: 10px;
  }
  .compare-block {
    border: 2px solid #17a2b8;
    border-radius: 8px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .compare-header {
    background: #17a2b8;
    color: white;
    padding: 8px 14px;
    font-weight: bold;
    font-size: 0.95em;
  }
  .compare-body { padding: 12px; }
  .compare-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9em;
  }
  .compare-table th {
    background: #e8f9fc;
    padding: 7px 8px;
    text-align: left;
    font-size: 0.82em;
    color: #555;
    border-bottom: 1px solid #bee5eb;
  }
  .compare-table td {
    padding: 7px 6px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
  }
  .compare-table tr:last-child td { border-bottom: none; }
  .compare-table input {
    margin-bottom: 0;
    padding: 5px 8px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fffbe6;
  }
  .compare-subtotal {
    text-align: right;
    font-weight: bold;
    font-size: 0.95em;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 2px solid #bee5eb;
    color: #333;
  }
  .compare-subtotal .jpy { color: #d63384; }
  .compare-na {
    background: #f8d7da;
    border: 1px solid #f5c6cb;
    border-radius: 6px;
    padding: 10px 14px;
    color: #721c24;
    font-size: 0.9em;
    font-weight: bold;
  }

  /* ── コピー行エリア ── */
  .copy-lines-area { margin-top: 10px; display: none; }
  .copy-line-header {
    font-size: 0.8em; color: #888; margin-bottom: 6px;
    padding: 4px 6px; background: #f0f4f8; border-radius: 4px; font-weight: bold;
  }
  .copy-line-divider {
    font-size: 0.8em; font-weight: bold; color: #555;
    background: #f0f4f8; padding: 5px 10px; border-radius: 4px; margin: 8px 0 3px;
  }
  .copy-line-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .copy-line-row-split { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
  .copy-line-row-split .col-foreign { flex: 3; display: flex; align-items: center; gap: 4px; }
  .copy-line-row-split .col-jpy     { flex: 2; display: flex; align-items: center; gap: 4px; }
  .col-label {
    font-size: 0.72em; font-weight: bold; white-space: nowrap;
    color: #fff; padding: 2px 6px; border-radius: 3px; flex-shrink: 0;
  }
  .col-label.foreign { background: #0056b3; }
  .col-label.jpy     { background: #d63384; }
  .copy-line-input {
    flex: 1; font-family: monospace; font-size: 0.88em;
    padding: 8px 10px !important; border: 1px solid #ccc !important;
    border-radius: 6px; background: #fff; color: #333;
    cursor: pointer; margin-bottom: 0 !important;
    caret-color: transparent; min-width: 0;
  }
  .copy-line-input:focus { border-color: #007bff !important; outline: none; background: #e8f4fd; }
  .copy-line-input.copied { background: #d4edda !important; border-color: #28a745 !important; transition: background 0.15s; }
  .copy-line-btn {
    padding: 7px 10px; font-size: 13px; white-space: nowrap;
    background: #6c757d; color: white; border-radius: 6px;
    border: none; cursor: pointer; flex-shrink: 0;
  }
  .copy-line-btn:active { opacity: 0.7; }
  .copy-success { color: #28a745; font-size: 0.85em; font-weight: bold; margin-left: 8px; display: none; }
  .jpy-suffix {
    font-size: 0.85em; font-weight: bold; color: #d63384;
    white-space: nowrap; flex-shrink: 0;
  }

  @media print {
    button, .no-print, .copy-lines-area, .quick-calc { display: none !important; }
    body { max-width: 100%; padding: 0; background: white; }
    .card { border: 1px solid #ccc; }
    .group-block { border: 1px solid #333; }
    .group-header { background: #333 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .section-label { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .compare-block { border: 1px solid #17a2b8; }
    .compare-header { background: #17a2b8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<h2>外貨換算・見積アプリ</h2>

<!-- 為替レート設定（✅ 依頼先タブを削除） -->
<div class="card">
  <h3>📅 為替レート設定</h3>

  <label>日付:</label>
  <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
    <input type="date" id="date" style="margin-bottom:0; flex:1;" onchange="saveSettings(); calcQuick()">
    <button type="button" onclick="openRate()" style="white-space:nowrap; padding:10px 12px;">為替ページを開く</button>
  </div>

  <label>レート種別:</label>
  <div class="rate-type-tabs no-print">
    <button id="tab-TTS" class="active" onclick="selectRateType('TTS')">TTS（売レート）</button>
    <button id="tab-TTB" onclick="selectRateType('TTB')">TTB（買レート）</button>
    <button id="tab-TTM" onclick="selectRateType('TTM')">TTM（仲値）</button>
  </div>
  <div id="rateTypeLabel" style="font-weight:bold; font-size:0.9em; color:#007bff; margin-bottom:6px; display:none;">
    適用レート：TTS
  </div>

  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
    <div>
      <label>USD レート</label>
      <input type="number" id="rateUSD" step="0.0001" placeholder="例: 150.25"
        oninput="saveSettings(); recalcAll(); calcQuick()">
    </div>
    <div>
      <label>EUR レート</label>
      <input type="number" id="rateEUR" step="0.0001" placeholder="例: 163.50"
        oninput="saveSettings(); recalcAll(); calcQuick()">
    </div>
    <div>
      <label>GBP レート</label>
      <input type="number" id="rateGBP" step="0.0001" placeholder="例: 190.00"
        oninput="saveSettings(); recalcAll(); calcQuick()">
    </div>
  </div>

  <div style="display:flex; gap:8px; align-items:center;">
    <label style="margin:0; white-space:nowrap; line-height:2.2;">端数処理:</label>
    <select id="rounding" style="margin-bottom:0;" onchange="saveSettings(); recalcAll(); calcQuick()">
      <option value="round">四捨五入</option>
      <option value="ceil">切り上げ</option>
      <option value="floor">切り捨て</option>
    </select>
  </div>

  <!-- 簡易換算欄 -->
  <div class="quick-calc no-print">
    <div class="quick-calc-label">💱 簡易換算</div>
    <div class="quick-calc-row">
      <input type="number" id="quickAmount" min="0" step="0.01"
        placeholder="金額を入力" oninput="calcQuick()">
      <select id="quickCurrency" onchange="calcQuick()">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
      </select>
      <button type="button" class="quick-clear-btn" onclick="clearQuick()" title="クリア">✕</button>
      <span class="quick-calc-arrow">→</span>
      <div class="quick-calc-result" id="quickResult">－</div>
    </div>
    <div class="quick-calc-rate-row">
      <input type="text" id="quickRateText" readonly inputmode="none"
        value="レート未入力" class="disabled-look">
      <button id="quickRateCopyBtn" type="button" class="is-disabled" onclick="copyQuickRate()">📋</button>
    </div>
  </div>
</div>

<!-- 明細入力（✅ 依頼先タブをここに移動） -->
<div class="card">
  <h3>📋 明細入力</h3>

  <!-- ✅ 依頼先タブ -->
  <label>依頼先:</label>
  <div class="agency-tabs no-print">
    <button id="tab-local" class="active" onclick="selectAgency('local')">Local Agency</button>
    <button id="tab-sgs"   onclick="selectAgency('sgs')">SGS</button>
  </div>
  <div id="agencyLabel" style="font-weight:bold; font-size:0.9em; color:#28a745; margin-bottom:10px; display:none;">
    依頼先：Local Agency
  </div>

  <div id="groupList"></div>
</div>

<!-- 比較表示 -->
<div class="card" id="compareCard" style="display:none;">
  <h3>🔄 比較表示</h3>
  <div style="display:flex; gap:5px; align-items:center; flex-wrap:wrap; margin-bottom:8px;">
    <button class="btn-info" onclick="generateCompare()">
      <span id="compareBtnLabel">SGS単価で比較</span>
    </button>
    <button class="btn-secondary" onclick="closeCompare()">閉じる</button>
  </div>
  <div class="compare-area" id="compareArea"></div>
</div>

<!-- 操作ボタン -->
<div class="card no-print">
  <div style="display:flex; gap:5px; flex-wrap:wrap;">
    <button class="btn-danger" style="flex:1;" onclick="clearAll()">全クリア</button>
  </div>
</div>

<!-- コピー用テキスト -->
<div class="card no-print">
  <h3>📋 コピー用テキスト</h3>
  <div style="display:flex; gap:5px; align-items:center; flex-wrap:wrap;">
    <button class="btn-warning" onclick="generateCopyLines()">テキストを生成</button>
    <button class="btn-primary" id="copyAllBtn" onclick="copyAllText()" style="display:none;">📋 生成テキストを全コピー</button>
    <span class="copy-success" id="copySuccess">✅ コピーしました！</span>
  </div>
  <div class="copy-lines-area" id="copyLinesArea"></div>
</div>

<script>

// =========================
// 数値フォーマット用ヘルパー
// =========================
function nfmt2(v){
  return v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function nfmtQty(v){
  return v.toLocaleString("en-US",{maximumFractionDigits:4});
}

// =========================
// localStorage 保存・復元
// =========================
function saveSettings() {
  localStorage.setItem("rateUSD",  document.getElementById("rateUSD").value);
  localStorage.setItem("rateEUR",  document.getElementById("rateEUR").value);
  localStorage.setItem("rateGBP",  document.getElementById("rateGBP").value);
  localStorage.setItem("rounding", document.getElementById("rounding").value);
  localStorage.setItem("date",     document.getElementById("date").value);
}
function loadSettings() {
  const usd      = localStorage.getItem("rateUSD");
  const eur      = localStorage.getItem("rateEUR");
  const gbp      = localStorage.getItem("rateGBP");
  const rounding = localStorage.getItem("rounding");
  const rateType = localStorage.getItem("rateType");
  const agency   = localStorage.getItem("agency");
  const date     = localStorage.getItem("date");
  if (usd)      document.getElementById("rateUSD").value  = usd;
  if (eur)      document.getElementById("rateEUR").value  = eur;
  if (gbp)      document.getElementById("rateGBP").value  = gbp;
  if (rounding) document.getElementById("rounding").value = rounding;
  if (rateType) selectRateType(rateType);
  if (agency)   selectAgency(agency);
  if (date)     document.getElementById("date").value     = date;
  calcQuick();
}
window.addEventListener("load", function(){
  loadSettings();
  if(groupCount===0) addGroup();
});

// =========================
// 簡易換算
// =========================
function calcQuick(){
  const amount  = parseFloat(document.getElementById("quickAmount").value);
  const currency= document.getElementById("quickCurrency").value;
  const rounding= document.getElementById("rounding").value;
  const resultEl= document.getElementById("quickResult");
  const rate    = getRate(currency);

  if(isNaN(amount)||amount<=0){
    resultEl.textContent="－";
    resultEl.className="quick-calc-result";
  } else if(rate===null){
    resultEl.textContent=`${currency} レートを入力してください`;
    resultEl.className="quick-calc-result no-rate";
  } else {
    const jpy=roundValue(amount*rate, rounding);
    resultEl.textContent=`${jpy.toLocaleString()} 円`;
    resultEl.className="quick-calc-result";
  }
  updateQuickRateText(currency, rate);
}

function clearQuick(){
  document.getElementById("quickAmount").value="";
  document.getElementById("quickResult").textContent="－";
  document.getElementById("quickResult").className="quick-calc-result";
  const currency=document.getElementById("quickCurrency").value;
  const rate=getRate(currency);
  updateQuickRateText(currency, rate);
}

function updateQuickRateText(currency, rate){
  const textEl = document.getElementById("quickRateText");
  const btnEl  = document.getElementById("quickRateCopyBtn");
  const dateStr= document.getElementById("date").value;
  const dateJa = formatDateJa(dateStr);

  if(rate===null){
    textEl.value=`${currency} レート未入力`;
    textEl.classList.add("disabled-look");
    btnEl.classList.add("is-disabled");
    quickRateEnabled=false;
  } else {
    textEl.value=`換算レート${currentRateType}：${dateJa}　¥${rate.toFixed(2)}/${currency}`;
    textEl.classList.remove("disabled-look");
    btnEl.classList.remove("is-disabled");
    quickRateEnabled=true;
  }
}

function copyQuickRate(){
  if(!quickRateEnabled) return;
  const inp = document.getElementById("quickRateText");
  const btn = document.getElementById("quickRateCopyBtn");
  const text = inp.value;
  const showFlash=()=>{
    inp.classList.add("copied");
    btn.textContent="✅";
    const msg=document.getElementById("copySuccess");
    msg.style.display="inline";
    setTimeout(()=>{
      inp.classList.remove("copied");
      btn.textContent="📋";
      msg.style.display="none";
    },1500);
  };
  navigator.clipboard.writeText(text).then(showFlash).catch(()=>{
    inp.select(); document.execCommand("copy"); showFlash();
  });
}

document.addEventListener("DOMContentLoaded",function(){
  const el=document.getElementById("quickRateText");
  if(el){
    el.addEventListener("click",function(){ if(quickRateEnabled)this.select(); });
    el.addEventListener("focus",function(){ if(quickRateEnabled)this.select(); });
  }
});

function selectRateType(type) {
  currentRateType = type;
  ["TTS","TTB","TTM"].forEach(t=>{
    document.getElementById(`tab-${t}`).classList.toggle("active", t===type);
  });
  const labelMap={TTS:"TTS（売レート）",TTB:"TTB（買レート）",TTM:"TTM（仲値）"};
  document.getElementById("rateTypeLabel").textContent=`適用レート：${labelMap[type]}`;

  calcQuick();
}

function formatDateJa(dateStr) {
  if(!dateStr) return "日付未入力";
  const [y,m,d]=dateStr.split("-").map(Number);
  return `${y}年${m}月${d}日`;
}

// =========================
// 祝日判定
// =========================
function isBaseHolidaySimple(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  if(m===1&&d===1)return true;
  if(y>=1967&&m===2&&d===11)return true;
  if(y>=2020&&m===2&&d===23)return true;
  if(y>=1989&&y<=2018&&m===12&&d===23)return true;
  if(y>=1989&&m===4&&d===29)return true;
  if(m===5&&d===3)return true;
  if(y>=2007&&m===5&&d===4)return true;
  if(m===5&&d===5)return true;
  if(y>=2016&&m===8&&d===11)return true;
  if(m===11&&d===3)return true;
  if(m===11&&d===23)return true;
  function getNthMonday(year,month,nth){
    const first=new Date(year,month-1,1);
    const offset=(1-first.getDay()+7)%7;
    return 1+offset+(nth-1)*7;
  }
  if(y>=2000&&m===1&&d===getNthMonday(y,1,2))return true;
  if(y>=2003&&m===7&&d===getNthMonday(y,7,3))return true;
  if(y>=2003&&m===9&&d===getNthMonday(y,9,3))return true;
  if(y>=2022&&m===10&&d===getNthMonday(y,10,2))return true;
  if(y===2020&&m===7&&d===24)return true;
  if(y===2021&&m===7&&d===23)return true;
  if(y>=1980&&y<=2099){
    const spring=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));
    if(m===3&&d===spring)return true;
    const autumn=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));
    if(m===9&&d===autumn)return true;
  }
  return false;
}
function isKokuminNoKyujitsu(date){
  const w=date.getDay();
  if(w===0||w===6)return false;
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  return isBaseHolidaySimple(new Date(y,m-1,d-1))&&isBaseHolidaySimple(new Date(y,m-1,d+1));
}
function isJapaneseHoliday(date){
  if(isBaseHolidaySimple(date))return true;
  if(isKokuminNoKyujitsu(date))return true;
  if(date.getDay()===0)return false;
  let check=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  for(let s=1;s<=7;s++){
    check.setDate(check.getDate()-1);
    const cw=check.getDay();
    if(cw===0)return isBaseHolidaySimple(check);
    if(!isBaseHolidaySimple(check)&&!isKokuminNoKyujitsu(check))return false;
  }
  return false;
}

// =========================
// 為替ページを開く
// =========================
function openRate(){
  const input=document.getElementById("date").value;
  if(!input){alert("日付を入力してください");return;}
  const[iy,im,id]=input.split("-").map(Number);
  let date=new Date(iy,im-1,id);
  const today=new Date();today.setHours(0,0,0,0);
  if(date>today){alert("未来の日付は指定できません");return;}
  let count=0;
  while(count<30){
    const w=date.getDay();
    if(w===0||w===6||isJapaneseHoliday(date)){date.setDate(date.getDate()-1);count++;}
    else break;
  }
  if(count>=30){alert("営業日の特定に失敗しました。");return;}
  const yy=String(date.getFullYear()).slice(-2);
  const mm=String(date.getMonth()+1).padStart(2,'0');
  const dd=String(date.getDate()).padStart(2,'0');
  if(count>0)alert("休業日のため "+date.getFullYear()+"-"+mm+"-"+dd+"（営業日）を表示します");
  window.open("https://www.murc-kawasesouba.jp/fx/past/index.php?id="+yy+mm+dd,"_blank");
  setTimeout(()=>{
    alert("ページが表示されない場合は、さらに前日のレートを確認してください。");
  },500);
}

// =========================
// ユーティリティ
// =========================
function getRate(currency){
  if(currency==="JPY")return 1;
  const el=document.getElementById("rate"+currency);
  if(!el)return null;
  const v=parseFloat(el.value);
  return(isNaN(v)||v<=0)?null:v;
}
function roundValue(v,mode){
  if(mode==="ceil")return Math.ceil(v);
  if(mode==="floor")return Math.floor(v);
  return Math.round(v);
}
function fmtF(cur,v){
  if(cur==="JPY")return v>0?`¥${Math.round(v).toLocaleString()}`:"-";
  return v>0?`${cur} ${nfmt2(v)}`:"-";
}
function fmtJ(v,rate,rounding,isJPY){
  if(isJPY){if(v===0)return"-";return`${Math.round(v).toLocaleString()} 円`;}
  if(rate===null)return`<span style="color:#aaa;">-</span>`;
  if(v===0)return"-";
  return`${roundValue(v*rate,rounding).toLocaleString()} 円`;
}
function getCountriesForAgency(agency){ return Object.keys(PRICE_TABLE[agency]); }
function getMileageLabel(t){ return t==="mile"?"mile":t==="perday"?"日":"km"; }

function rebuildCountrySelect(gid){
  const sel=document.getElementById(`country-${gid}`);
  const current=sel.value;
  const countries=getCountriesForAgency(currentAgency);
  sel.innerHTML=`<option value="">-- 選択してください --</option>`;
  countries.forEach(c=>{
    const opt=document.createElement("option");
    opt.value=c; opt.textContent=c;
    if(c===current)opt.selected=true;
    sel.appendChild(opt);
  });
  if(current&&!countries.includes(current)){sel.value="";onCountryChange(gid);}
  else if(current&&countries.includes(current)){onCountryChange(gid);}
}

function onCountryChange(gid){
  const country=document.getElementById(`country-${gid}`).value;
  const infoEl =document.getElementById(`rateInfo-${gid}`);
  const secCont=document.getElementById(`section-contract-${gid}`);
  const secExp =document.getElementById(`section-expense-${gid}`);
  const subEl  =document.getElementById(`groupSubtotal-${gid}`);
  const titleEl=document.getElementById(`groupTitle-${gid}`);

  [`row-mileage-${gid}`,`row-hotel-fixed-${gid}`,`row-hotel-${gid}`,
   `row-daily-fixed-${gid}`,`row-daily-${gid}`,`row-transport-${gid}`
  ].forEach(id=>{ const el=document.getElementById(id); if(el)el.style.display="none"; });

  if(!country||!PRICE_TABLE[currentAgency][country]){
    [infoEl,secCont,secExp,subEl].forEach(el=>el.style.display="none");
    titleEl.textContent="国を選択してください";
    return;
  }

  const p    =PRICE_TABLE[currentAgency][country];
  const cur  =p.currency;
  const isJPY=(cur==="JPY");
  titleEl.textContent=`${country}　（${cur}）`;

  let mileageInfo="";
  if(p.mileageType==="km")          mileageInfo=`交通費(/km): <span>${nfmt2(p.mileage)}</span>`;
  else if(p.mileageType==="mile")   mileageInfo=`交通費(/mile): <span>${nfmt2(p.mileage)}</span>`;
  else if(p.mileageType==="perday") mileageInfo=`交通費(/day): <span>${nfmt2(p.mileage)}</span>`;
  else                              mileageInfo=`交通費: <span>実費</span>`;

  const mandayDisp=isJPY?`¥${p.manday.toLocaleString()}`:`${cur} ${nfmt2(p.manday)}`;
  const hourlyDisp=isJPY?`¥${p.hourly.toLocaleString()}`:`${cur} ${nfmt2(p.hourly)}`;

  infoEl.style.display="block";
  infoEl.innerHTML=`通貨: <span>${cur}</span> ／ 技術料単価(日): <span>${mandayDisp}</span> ／ 技術料/時間外単価(/H): <span>${hourlyDisp}</span> ／ ${mileageInfo}`;
  document.getElementById(`price-manday-${gid}`).textContent  =mandayDisp;
  document.getElementById(`price-mandayH-${gid}`).textContent =hourlyDisp;
  document.getElementById(`price-overtime-${gid}`).textContent=hourlyDisp;
  secCont.style.display="block";
  subEl.style.display  ="block";

  if(p.mileageType==="km"||p.mileageType==="mile"||p.mileageType==="perday"){
    document.getElementById(`row-mileage-${gid}`).style.display="";
    document.getElementById(`unit-mileage-${gid}`).textContent=getMileageLabel(p.mileageType);
    const pd=isJPY?`¥${p.mileage.toLocaleString()}`:`${cur} ${nfmt2(p.mileage)}`;
    document.getElementById(`price-mileage-${gid}`).textContent=pd;
  }

  secExp.style.display="block";
  const curDisp=isJPY?"JPY":cur;
  const isLocalChina=(currentAgency==="local"&&country==="China");
  if(isLocalChina){
    document.getElementById(`row-hotel-fixed-${gid}`).style.display="";
    document.getElementById(`row-daily-fixed-${gid}`).style.display="";
  } else {
    document.getElementById(`row-hotel-${gid}`).style.display="";
    document.getElementById(`cur-hotel-${gid}`).textContent=curDisp;
    document.getElementById(`row-daily-${gid}`).style.display="";
    document.getElementById(`cur-daily-${gid}`).textContent=curDisp;
  }
  document.getElementById(`row-transport-${gid}`).style.display="";
  document.getElementById(`cur-transport-${gid}`).textContent=curDisp;

  calcGroup(gid);
}

function calcGroup(gid){
  const country=document.getElementById(`country-${gid}`).value;
  if(!country||!PRICE_TABLE[currentAgency][country])return;

  const p       =PRICE_TABLE[currentAgency][country];
  const cur     =p.currency;
  const isJPY   =(cur==="JPY");
  const rounding=document.getElementById("rounding").value;
  const rate    =getRate(cur);
  const isLocalChina=(currentAgency==="local"&&country==="China");

  const manday  =parseFloat(document.getElementById(`manday-${gid}`).value)  ||0;
  const mandayH =parseFloat(document.getElementById(`mandayH-${gid}`).value) ||0;
  const overtime=parseFloat(document.getElementById(`overtime-${gid}`).value)||0;
  const sMandayF  =manday  *p.manday;
  const sMandayHF =mandayH *p.hourly;
  const sOvertimeF=overtime*p.hourly;

  document.getElementById(`sub-manday-f-${gid}`).textContent  =fmtF(cur,sMandayF);
  document.getElementById(`sub-mandayH-f-${gid}`).textContent =fmtF(cur,sMandayHF);
  document.getElementById(`sub-overtime-f-${gid}`).textContent=fmtF(cur,sOvertimeF);
  document.getElementById(`sub-manday-j-${gid}`).innerHTML  =fmtJ(sMandayF,  rate,rounding,isJPY);
  document.getElementById(`sub-mandayH-j-${gid}`).innerHTML =fmtJ(sMandayHF, rate,rounding,isJPY);
  document.getElementById(`sub-overtime-j-${gid}`).innerHTML=fmtJ(sOvertimeF,rate,rounding,isJPY);

  let sMileageF=0;
  if(p.mileageType==="km"||p.mileageType==="mile"||p.mileageType==="perday"){
    const mileage=parseFloat(document.getElementById(`mileage-${gid}`).value)||0;
    sMileageF=mileage*p.mileage;
    document.getElementById(`sub-mileage-f-${gid}`).textContent=fmtF(cur,sMileageF);
    document.getElementById(`sub-mileage-j-${gid}`).innerHTML  =fmtJ(sMileageF,rate,rounding,isJPY);
  }

  let expenseTotal=0;
  if(isLocalChina){
    const hotelN=parseFloat(document.getElementById(`hotel-fixed-${gid}`).value)||0;
    const dailyN=parseFloat(document.getElementById(`daily-fixed-${gid}`).value)||0;
    const sHF=hotelN*CHINA_LOCAL_EXPENSE.accommodation;
    const sDF=dailyN*CHINA_LOCAL_EXPENSE.dailyAllowance;
    expenseTotal+=sHF+sDF;
    document.getElementById(`sub-hotel-fixed-f-${gid}`).textContent=fmtF("USD",sHF);
    document.getElementById(`sub-hotel-fixed-j-${gid}`).innerHTML  =fmtJ(sHF,rate,rounding,false);
    document.getElementById(`sub-daily-fixed-f-${gid}`).textContent=fmtF("USD",sDF);
    document.getElementById(`sub-daily-fixed-j-${gid}`).innerHTML  =fmtJ(sDF,rate,rounding,false);
  } else {
    const sHF=parseFloat(document.getElementById(`hotel-${gid}`).value)||0;
    const sDF=parseFloat(document.getElementById(`daily-${gid}`).value)||0;
    expenseTotal+=sHF+sDF;
    document.getElementById(`sub-hotel-f-${gid}`).textContent=fmtF(cur,sHF);
    document.getElementById(`sub-hotel-j-${gid}`).innerHTML  =fmtJ(sHF,rate,rounding,isJPY);
    document.getElementById(`sub-daily-f-${gid}`).textContent=fmtF(cur,sDF);
    document.getElementById(`sub-daily-j-${gid}`).innerHTML  =fmtJ(sDF,rate,rounding,isJPY);
  }

  const sTransportF=parseFloat(document.getElementById(`transport-${gid}`).value)||0;
  expenseTotal+=sTransportF;
  document.getElementById(`sub-transport-f-${gid}`).textContent=fmtF(cur,sTransportF);
  document.getElementById(`sub-transport-j-${gid}`).innerHTML  =fmtJ(sTransportF,rate,rounding,isJPY);

  const grandForeign=sMandayF+sMandayHF+sOvertimeF+sMileageF+expenseTotal;
  const subEl=document.getElementById(`groupSubtotal-${gid}`);
  let html;
  if(isJPY){
    html=`合計: <span style="color:#0056b3;">¥${Math.round(grandForeign).toLocaleString()}</span> → <span class="jpy">${Math.round(grandForeign).toLocaleString()} 円</span>`;
  } else {
    html=`合計: <span style="color:#0056b3;">${cur} ${nfmt2(grandForeign)}</span>`;
    if(rate!==null){
      html+=` → <span class="jpy">${roundValue(grandForeign*rate,rounding).toLocaleString()} 円</span>`;
    } else {
      html+=` <span style="color:#999;">（${cur}レートを入力してください）</span>`;
    }
  }
  subEl.innerHTML=html;
}

function recalcAll(){
  for(let i=1;i<=groupCount;i++){
    if(document.getElementById(`group-${i}`))calcGroup(i);
  }
}

// =========================
// 比較表示
// =========================
function generateCompare(){
  const otherAgency = currentAgency==="local"?"sgs":"local";
  const otherLabel  = otherAgency==="local"?"Local Agency":"SGS";
  const rounding    = document.getElementById("rounding").value;
  const area        = document.getElementById("compareArea");
  area.innerHTML    = "";
  let hasAny=false;

  for(let i=1;i<=groupCount;i++){
    const el=document.getElementById(`group-${i}`);
    if(!el)continue;
    const country=document.getElementById(`country-${i}`).value;
    if(!country||!PRICE_TABLE[currentAgency][country])continue;
    hasAny=true;

    const block=document.createElement("div");
    block.className="compare-block";
    const hdr=document.createElement("div");
    hdr.className="compare-header";

    if(!PRICE_TABLE[otherAgency][country]){
      hdr.textContent=`${country} — ${otherLabel}には単価設定なし`;
      const naDiv=document.createElement("div");
      naDiv.className="compare-body";
      const naMsg=document.createElement("div");
      naMsg.className="compare-na";
      naMsg.textContent=`${otherLabel}には ${country} の単価設定がありません。`;
      naDiv.appendChild(naMsg);
      block.appendChild(hdr);
      block.appendChild(naDiv);
      area.appendChild(block);
      continue;
    }

    const op    =PRICE_TABLE[otherAgency][country];
    const ocur  =op.currency;
    const oIsJPY=(ocur==="JPY");
    const orate =getRate(ocur);

    hdr.textContent=`${country}（${ocur}）— ${otherLabel}単価で計算`;
    block.appendChild(hdr);

    const body=document.createElement("div");
    body.className="compare-body";

    const manday  =parseFloat(document.getElementById(`manday-${i}`).value)  ||0;
    const mandayH =parseFloat(document.getElementById(`mandayH-${i}`).value) ||0;
    const overtime=parseFloat(document.getElementById(`overtime-${i}`).value)||0;
    const mileage =parseFloat(document.getElementById(`mileage-${i}`).value) ||0;

    const isLocalChina=(currentAgency==="local"&&country==="China");
    let initHotel=0, initDaily=0, initTransport=0;
    if(isLocalChina){
      initHotel    =(parseFloat(document.getElementById(`hotel-fixed-${i}`).value)||0)*CHINA_LOCAL_EXPENSE.accommodation;
      initDaily    =(parseFloat(document.getElementById(`daily-fixed-${i}`).value)||0)*CHINA_LOCAL_EXPENSE.dailyAllowance;
      initTransport= parseFloat(document.getElementById(`transport-${i}`).value)||0;
    } else {
      initHotel    =parseFloat(document.getElementById(`hotel-${i}`).value)    ||0;
      initDaily    =parseFloat(document.getElementById(`daily-${i}`).value)    ||0;
      initTransport=parseFloat(document.getElementById(`transport-${i}`).value)||0;
    }

    const cpfx=`cmp-${i}`;
    const tbl=document.createElement("table");
    tbl.className="compare-table";
    tbl.innerHTML=`<thead><tr>
      <th>項目</th><th>単価</th><th>数量／金額</th><th>単位</th>
      <th style="text-align:right;">外貨小計</th>
      <th style="text-align:right;">円換算</th>
    </tr></thead>`;
    const tbody=document.createElement("tbody");

    const sMandayF=manday*op.manday;
    tbody.innerHTML+=makeCompareRow("技術料",
      oIsJPY?`¥${op.manday.toLocaleString()}`:`${ocur} ${nfmt2(op.manday)}`,
      nfmtQty(manday),"日",fmtF(ocur,sMandayF),fmtJval(sMandayF,orate,rounding,oIsJPY));

    const sMandayHF=mandayH*op.hourly;
    tbody.innerHTML+=makeCompareRow("技術料",
      oIsJPY?`¥${op.hourly.toLocaleString()}`:`${ocur} ${nfmt2(op.hourly)}`,
      nfmtQty(mandayH),"H",fmtF(ocur,sMandayHF),fmtJval(sMandayHF,orate,rounding,oIsJPY));

    const sOvertimeF=overtime*op.hourly;
    tbody.innerHTML+=makeCompareRow("時間外",
      oIsJPY?`¥${op.hourly.toLocaleString()}`:`${ocur} ${nfmt2(op.hourly)}`,
      nfmtQty(overtime),"H",fmtF(ocur,sOvertimeF),fmtJval(sOvertimeF,orate,rounding,oIsJPY));

    let sMileageF=0;
    if(op.mileageType==="km"||op.mileageType==="mile"||op.mileageType==="perday"){
      sMileageF=mileage*op.mileage;
      tbody.innerHTML+=makeCompareRow("交通費",
        oIsJPY?`¥${op.mileage.toLocaleString()}`:`${ocur} ${nfmt2(op.mileage)}`,
        nfmtQty(mileage),getMileageLabel(op.mileageType),
        fmtF(ocur,sMileageF),fmtJval(sMileageF,orate,rounding,oIsJPY));
    }

    tbl.appendChild(tbody);
    body.appendChild(tbl);

    const expLabel=document.createElement("span");
    expLabel.className="section-label expense";
    expLabel.style.marginTop="10px";
    expLabel.textContent="実費精算（手動修正可）";
    body.appendChild(expLabel);

    const expTbl=document.createElement("table");
    expTbl.className="compare-table";
    expTbl.innerHTML=`<thead><tr>
      <th>項目</th><th></th><th>金額</th><th>通貨</th>
      <th style="text-align:right;">外貨小計</th>
      <th style="text-align:right;">円換算</th>
    </tr></thead>`;
    const expTbody=document.createElement("tbody");
    expTbody.appendChild(makeExpenseRow(cpfx,"hotel",    ocur,initHotel,    orate,rounding,oIsJPY,"宿泊費",i));
    expTbody.appendChild(makeExpenseRow(cpfx,"daily",    ocur,initDaily,    orate,rounding,oIsJPY,"日当",  i));
    expTbody.appendChild(makeExpenseRow(cpfx,"transport",ocur,initTransport,orate,rounding,oIsJPY,"交通費",i));
    expTbl.appendChild(expTbody);
    body.appendChild(expTbl);

    const subtotalDiv=document.createElement("div");
    subtotalDiv.className="compare-subtotal";
    subtotalDiv.id=`${cpfx}-subtotal`;
    body.appendChild(subtotalDiv);
    block.appendChild(body);
    area.appendChild(block);

    updateCompareSubtotal(cpfx,ocur,oIsJPY,orate,rounding,
      sMandayF,sMandayHF,sOvertimeF,sMileageF,initHotel,initDaily,initTransport);
  }

  if(!hasAny){ alert("明細を入力してください。"); return; }
  area.style.display="block";
}

function makeCompareRow(label,price,qty,unit,fStr,jStr){
  return `<tr>
    <td class="label-cell">${label}</td>
    <td class="unit-cell">${price}</td>
    <td style="text-align:right;">${qty}</td>
    <td class="unit-cell">${unit}</td>
    <td class="subtotal-cell">${fStr}</td>
    <td class="subtotal-cell">${jStr}</td>
  </tr>`;
}

function makeExpenseRow(cpfx,key,cur,initVal,rate,rounding,isJPY,label,gid){
  const tr=document.createElement("tr");
  const curDisp=isJPY?"JPY":cur;
  tr.innerHTML=`
    <td class="label-cell">${label}</td>
    <td class="unit-cell">実費</td>
    <td>
      <input type="number" id="${cpfx}-${key}" min="0" step="0.01"
        value="${initVal>0?initVal:""}" placeholder="0.00"
        oninput="onCompareExpenseInput('${cpfx}','${cur}',${isJPY},'${cur}',${rate},'${rounding}',${gid})">
    </td>
    <td class="unit-cell">${curDisp}</td>
    <td class="subtotal-cell" id="${cpfx}-${key}-f">${fmtF(cur,initVal)}</td>
    <td class="subtotal-cell" id="${cpfx}-${key}-j">${fmtJval(initVal,rate,rounding,isJPY)}</td>
  `;
  return tr;
}

function fmtJval(v,rate,rounding,isJPY){
  if(isJPY){if(v===0)return"-";return`${Math.round(v).toLocaleString()} 円`;}
  if(rate===null)return`<span style="color:#aaa;">-</span>`;
  if(v===0)return"-";
  return`${roundValue(v*rate,rounding).toLocaleString()} 円`;
}

function onCompareExpenseInput(cpfx,cur,isJPY,_cur,rate,rounding,gid){
  const hotel    =parseFloat(document.getElementById(`${cpfx}-hotel`).value)    ||0;
  const daily    =parseFloat(document.getElementById(`${cpfx}-daily`).value)    ||0;
  const transport=parseFloat(document.getElementById(`${cpfx}-transport`).value)||0;
  document.getElementById(`${cpfx}-hotel-f`).textContent    =fmtF(cur,hotel);
  document.getElementById(`${cpfx}-hotel-j`).innerHTML      =fmtJval(hotel,    rate,rounding,isJPY);
  document.getElementById(`${cpfx}-daily-f`).textContent    =fmtF(cur,daily);
  document.getElementById(`${cpfx}-daily-j`).innerHTML      =fmtJval(daily,    rate,rounding,isJPY);
  document.getElementById(`${cpfx}-transport-f`).textContent=fmtF(cur,transport);
  document.getElementById(`${cpfx}-transport-j`).innerHTML  =fmtJval(transport,rate,rounding,isJPY);

  const otherAgency=currentAgency==="local"?"sgs":"local";
  const country=document.getElementById(`country-${gid}`).value;
  if(!country||!PRICE_TABLE[otherAgency][country])return;
  const op=PRICE_TABLE[otherAgency][country];
  const manday  =parseFloat(document.getElementById(`manday-${gid}`).value)  ||0;
  const mandayH =parseFloat(document.getElementById(`mandayH-${gid}`).value) ||0;
  const overtime=parseFloat(document.getElementById(`overtime-${gid}`).value)||0;
  const mileage =parseFloat(document.getElementById(`mileage-${gid}`).value) ||0;
  const sMandayF  =manday  *op.manday;
  const sMandayHF =mandayH *op.hourly;
  const sOvertimeF=overtime*op.hourly;
  let sMileageF=0;
  if(op.mileageType==="km"||op.mileageType==="mile"||op.mileageType==="perday"){
    sMileageF=mileage*op.mileage;
  }
  updateCompareSubtotal(cpfx,cur,isJPY,rate,rounding,sMandayF,sMandayHF,sOvertimeF,sMileageF,hotel,daily,transport);
}

function updateCompareSubtotal(cpfx,cur,isJPY,rate,rounding,sMandayF,sMandayHF,sOvertimeF,sMileageF,hotel,daily,transport){
  const grand=sMandayF+sMandayHF+sOvertimeF+sMileageF+hotel+daily+transport;
  const subEl=document.getElementById(`${cpfx}-subtotal`);
  if(!subEl)return;
  let html;
  if(isJPY){
    html=`合計: <span style="color:#0056b3;">¥${Math.round(grand).toLocaleString()}</span> → <span class="jpy">${Math.round(grand).toLocaleString()} 円</span>`;
  } else {
    html=`合計: <span style="color:#0056b3;">${cur} ${nfmt2(grand)}</span>`;
    if(rate!==null){
      html+=` → <span class="jpy">${roundValue(grand*rate,rounding).toLocaleString()} 円</span>`;
    } else {
      html+=` <span style="color:#999;">（${cur}レートを入力してください）</span>`;
    }
  }
  subEl.innerHTML=html;
}

function closeCompare(){
  document.getElementById("compareArea").style.display="none";
  document.getElementById("compareArea").innerHTML="";
}

// コピー行DOM生成ヘルパー
// =========================
function makeDivider(area,text){
  const div=document.createElement("div");
  div.className="copy-line-divider";
  div.textContent=text;
  area.appendChild(div);
}
function makeSingleRow(area,text){
  const row=document.createElement("div");
  row.className="copy-line-row";
  const inp=document.createElement("input");
  inp.type="text"; inp.className="copy-line-input";
  inp.setAttribute("inputmode","none");
  inp.value=text; inp.readOnly=true;
  inp.addEventListener("click",function(){ this.select(); });
  inp.addEventListener("focus",function(){ this.select(); });
  const btn=document.createElement("button");
  btn.className="copy-line-btn"; btn.textContent="📋";
  btn.addEventListener("click",function(){ copyLine(inp,btn); });
  row.appendChild(inp); row.appendChild(btn);
  area.appendChild(row);
}
function makeSplitRow(area,textForeign,jpyNumberText){
  const row=document.createElement("div");
  row.className="copy-line-row-split";

  const colF=document.createElement("div"); colF.className="col-foreign";
  const lblF=document.createElement("span"); lblF.className="col-label foreign"; lblF.textContent="外貨";
  const inpF=document.createElement("input");
  inpF.type="text"; inpF.className="copy-line-input";
  inpF.setAttribute("inputmode","none");
  inpF.value=textForeign; inpF.readOnly=true;
  inpF.addEventListener("click",function(){ this.select(); });
  inpF.addEventListener("focus",function(){ this.select(); });
  const btnF=document.createElement("button");
  btnF.className="copy-line-btn"; btnF.textContent="📋";
  btnF.addEventListener("click",function(){ copyLine(inpF,btnF); });
  colF.appendChild(lblF); colF.appendChild(inpF); colF.appendChild(btnF);

  const colJ=document.createElement("div"); colJ.className="col-jpy";
  const lblJ=document.createElement("span"); lblJ.className="col-label jpy"; lblJ.textContent="円換算";
  const inpJ=document.createElement("input");
  inpJ.type="text"; inpJ.className="copy-line-input";
  inpJ.setAttribute("inputmode","none");
  inpJ.value=jpyNumberText!==null?jpyNumberText:"レート未入力"; inpJ.readOnly=true;
  if(jpyNumberText===null)inpJ.style.color="#aaa";
  inpJ.addEventListener("click",function(){ this.select(); });
  inpJ.addEventListener("focus",function(){ this.select(); });
  const btnJ=document.createElement("button");
  btnJ.className="copy-line-btn"; btnJ.textContent="📋";
  if(jpyNumberText===null){ btnJ.disabled=true; btnJ.style.opacity="0.4"; }
  btnJ.addEventListener("click",function(){ copyLine(inpJ,btnJ); });
  const yenSuffix=document.createElement("span");
  yenSuffix.className="jpy-suffix"; yenSuffix.textContent="円";
  colJ.appendChild(lblJ); colJ.appendChild(inpJ); colJ.appendChild(btnJ); colJ.appendChild(yenSuffix);

  row.appendChild(colF); row.appendChild(colJ);
  area.appendChild(row);
}

// =========================
// コピー用テキスト生成
// =========================
function generateCopyLines(){
  const dateStr =document.getElementById("date").value;
  const dateJa  =formatDateJa(dateStr);
  const rounding=document.getElementById("rounding").value;
  const isLocalChina=(agency,country)=>(agency==="local"&&country==="China");

  const usedCurrencies=new Set();
  let hasAny=false;
  for(let i=1;i<=groupCount;i++){
    const el=document.getElementById(`group-${i}`);
    if(!el)continue;
    const country=document.getElementById(`country-${i}`).value;
    if(!country||!PRICE_TABLE[currentAgency][country])continue;
    const cur=PRICE_TABLE[currentAgency][country].currency;
    if(cur!=="JPY")usedCurrencies.add(cur);
    hasAny=true;
  }
  if(!hasAny){ alert("明細を入力してください。"); return; }

  const area=document.getElementById("copyLinesArea");
  area.innerHTML="";

  const header=document.createElement("div");
  header.className="copy-line-header";
  header.textContent="▼ 欄をクリックで全選択 → Ctrl+C（Mac: ⌘+C）でコピー　または　📋ボタンで即コピー";
  area.appendChild(header);

  makeDivider(area,"【換算レート】");
  let anyRate=false;
  for(const cur of usedCurrencies){
    const rate=getRate(cur);
    if(rate!==null){
      makeSingleRow(area,`換算レート${currentRateType}：${dateJa}　¥${rate.toFixed(2)}/${cur}`);
      anyRate=true;
    }
  }
  if(!anyRate&&usedCurrencies.size>0) makeDivider(area,"（レート未入力）");
  if(usedCurrencies.size===0)         makeDivider(area,"（JPY建てのため換算レート不要）");

  for(let i=1;i<=groupCount;i++){
    const el=document.getElementById(`group-${i}`);
    if(!el)continue;
    const country=document.getElementById(`country-${i}`).value;
    if(!country||!PRICE_TABLE[currentAgency][country])continue;

    const p   =PRICE_TABLE[currentAgency][country];
    const cur =p.currency;
    const isJPY=(cur==="JPY");
    const rate=getRate(cur);
    const lc  =isLocalChina(currentAgency,country);

    makeDivider(area,`▼ ${country}（${cur}）`);

    function jpyNum(v){
      if(isJPY)return v===0?"-":`${Math.round(v).toLocaleString()}`;
      if(rate===null)return null;
      if(v===0)return"-";
      return`${roundValue(v*rate,rounding).toLocaleString()}`;
    }
    function ff(v){
      if(isJPY) return v>0?`¥${Math.round(v).toLocaleString()}`:"-";
      return v>0?`${cur}${nfmt2(v)}`:"-";
    }

    makeDivider(area,"【協定単価】");
    const manday  =parseFloat(document.getElementById(`manday-${i}`).value)  ||0;
    const mandayH =parseFloat(document.getElementById(`mandayH-${i}`).value) ||0;
    const overtime=parseFloat(document.getElementById(`overtime-${i}`).value)||0;
    const sMandayF  =manday  *p.manday;
    const sMandayHF =mandayH *p.hourly;
    const sOvertimeF=overtime*p.hourly;
    const mp=isJPY?`¥${p.manday.toLocaleString()}`:`${cur}${nfmt2(p.manday)}`;
    const hp=isJPY?`¥${p.hourly.toLocaleString()}`:`${cur}${nfmt2(p.hourly)}`;
    if(manday>0)   makeSplitRow(area,`技術料：${mp} x ${nfmtQty(manday)}日 = ${ff(sMandayF)}`,  jpyNum(sMandayF));
    if(mandayH>0)  makeSplitRow(area,`技術料：${hp} x ${nfmtQty(mandayH)}H = ${ff(sMandayHF)}`, jpyNum(sMandayHF));
    if(overtime>0) makeSplitRow(area,`時間外：${hp} x ${nfmtQty(overtime)}H = ${ff(sOvertimeF)}`,jpyNum(sOvertimeF));
    if(p.mileageType==="km"||p.mileageType==="mile"||p.mileageType==="perday"){
      const mileage=parseFloat(document.getElementById(`mileage-${i}`).value)||0;
      if(mileage>0){
        const sMF=mileage*p.mileage;
        const ulbl=getMileageLabel(p.mileageType);
        const mlp=isJPY?`¥${p.mileage.toLocaleString()}`:`${cur}${nfmt2(p.mileage)}`;
        makeSplitRow(area,`交通費：${mlp} x ${nfmtQty(mileage)}${ulbl} = ${ff(sMF)}`,jpyNum(sMF));
      }
    }

    if(lc){
      const hotelN=parseFloat(document.getElementById(`hotel-fixed-${i}`).value)||0;
      const dailyN=parseFloat(document.getElementById(`daily-fixed-${i}`).value)||0;
      const sTF= parseFloat(document.getElementById(`transport-${i}`).value)||0;
      const sHF=hotelN*CHINA_LOCAL_EXPENSE.accommodation;
      const sDF=dailyN*CHINA_LOCAL_EXPENSE.dailyAllowance;
      if(hotelN>0||dailyN>0||sTF>0){
        makeDivider(area,"【実費精算】");
        if(hotelN>0){
          const up=`USD${nfmt2(CHINA_LOCAL_EXPENSE.accommodation)}`;
          makeSplitRow(area,`宿泊費：${up}(定額) x ${nfmtQty(hotelN)}泊 = ${ff(sHF)}`,jpyNum(sHF));
        }
        if(dailyN>0){
          const up=`USD${nfmt2(CHINA_LOCAL_EXPENSE.dailyAllowance)}`;
          makeSplitRow(area,`日当：${up}(定額) x ${nfmtQty(dailyN)}日 = ${ff(sDF)}`,jpyNum(sDF));
        }
        if(sTF>0) makeSplitRow(area,`交通費：${ff(sTF)}（実費）`,jpyNum(sTF));
      }
    } else {
      const sHF=parseFloat(document.getElementById(`hotel-${i}`).value)    ||0;
      const sDF=parseFloat(document.getElementById(`daily-${i}`).value)    ||0;
      const sTF=parseFloat(document.getElementById(`transport-${i}`).value)||0;
      if(sHF>0||sDF>0||sTF>0){
        makeDivider(area,"【実費精算】");
        if(sHF>0) makeSplitRow(area,`宿泊費：${ff(sHF)}（実費）`,jpyNum(sHF));
        if(sDF>0) makeSplitRow(area,`日当：${ff(sDF)}（実費）`,  jpyNum(sDF));
        if(sTF>0) makeSplitRow(area,`交通費：${ff(sTF)}（実費）`,jpyNum(sTF));
      }
    }
  }

  area.style.display="block";
  document.getElementById("copyAllBtn").style.display="inline-block";
}

// =========================
// 生成テキストを全コピー

function copyAllText(){
  const area=document.getElementById("copyLinesArea");
  if(!area||area.style.display==="none"){ alert("先にテキストを生成してください。"); return; }

  const lines=[];
  area.childNodes.forEach(node=>{
    if(!node.classList) return;
    if(node.classList.contains("copy-line-divider")){
      lines.push(node.textContent.trim());
      return;
    }
    if(node.classList.contains("copy-line-row")){
      const inp=node.querySelector("input.copy-line-input");
      if(inp&&inp.value) lines.push(inp.value);
      return;
    }
    if(node.classList.contains("copy-line-row-split")){
      const inputs=node.querySelectorAll("input.copy-line-input");
      const parts=[];
      inputs.forEach((inp,idx)=>{
        if(inp.value&&inp.value!=="レート未入力"){
          if(idx===1) parts.push(inp.value+"円");
          else        parts.push(inp.value);
        }
      });
      if(parts.length>0) lines.push(parts.join("　"));
      return;
    }
  });

  const text=lines.join("\n");
  if(!text){ alert("コピーするテキストがありません。"); return; }

  const btn=document.getElementById("copyAllBtn");
  const orig=btn.textContent;
  const showFlash=()=>{
    btn.textContent="✅ コピーしました！";
    btn.style.background="#28a745";
    setTimeout(()=>{
      btn.textContent=orig;
      btn.style.background="";
    },1500);
  };
  navigator.clipboard.writeText(text).then(showFlash).catch(()=>{
    const ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.select(); document.execCommand("copy");
    document.body.removeChild(ta);
    showFlash();
  });
}

function copyLine(inputEl,btnEl){
  const text=inputEl.value;
  const showFlash=()=>{
    inputEl.classList.add("copied");
    btnEl.textContent="✅";
    const msg=document.getElementById("copySuccess");
    msg.style.display="inline";
    setTimeout(()=>{ inputEl.classList.remove("copied"); btnEl.textContent="📋"; msg.style.display="none"; },1500);
  };
  navigator.clipboard.writeText(text).then(showFlash).catch(()=>{
    inputEl.select(); document.execCommand("copy"); showFlash();
  });
}

function removeGroup(gid){
  const el=document.getElementById(`group-${gid}`);
  if(el)el.remove();
  let anyLeft=false;
  for(let i=1;i<=groupCount;i++){
    if(document.getElementById(`group-${i}`)){anyLeft=true;break;}
  }
  if(!anyLeft) document.getElementById("compareCard").style.display="none";
  closeCompare();
}

function clearAll(){
  if(!confirm("全ての明細とレートをクリアしますか？"))return;
  document.getElementById("groupList").innerHTML="";
  ["rateUSD","rateEUR","rateGBP"].forEach(id=>{document.getElementById(id).value="";});
  document.getElementById("copyLinesArea").style.display="none";
  document.getElementById("copyLinesArea").innerHTML="";
  document.getElementById("copyAllBtn").style.display="none";
  document.getElementById("compareCard").style.display="none";
  closeCompare();
  ["rateUSD","rateEUR","rateGBP","rounding","rateType","date","agency"].forEach(key=>{
    localStorage.removeItem(key);
  });
  document.getElementById("date").value="";
  clearQuick();
  groupCount=0;
  addGroup();
}

document.addEventListener("keydown",function(e){
  const tag=document.activeElement.tagName;
  const isInput=(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT");
  if(e.key==="Escape"&&!isInput){if(confirm("全クリアしますか？"))clearAll();}
});
