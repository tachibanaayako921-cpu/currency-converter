<h2>外貨換算・見積アプリ</h2>

<!-- 為替レート設定 -->

  </div>

    依頼先：Local Agency
  </div>

  <label>日付:</label>
  <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
    <input type="date" id="date" style="margin-bottom:0; flex:1;" onchange="saveSettings()">
    <button type="button" onclick="openRate()" style="white-space:nowrap; padding:10px 12px;">為替ページを開く</button>
  </div>

  <label>レート種別:</label>
  <div class="rate-type-tabs no-print">
    <button id="tab-TTS" class="active" onclick="selectRateType('TTS')">TTS（売レート）</button>
    <button id="tab-TTB" onclick="selectRateType('TTB')">TTB（買レート）</button>
    <button id="tab-TTM" onclick="selectRateType('TTM')">TTM（仲値）</button>
  </div>
  <div id="rateTypeLabel" style="font-weight:bold; font-size:0.9em; color:#007bff; margin-bottom:6px; display:none;">
    適用レート：TTS
  </div>

  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
    <div>
      <label>USD レート</label>
      <input type="number" id="rateUSD" step="0.0001" placeholder="例: 150.25"
        oninput="saveSettings(); recalcAll()">
    </div>
    <div>
      <label>EUR レート</label>
      <input type="number" id="rateEUR" step="0.0001" placeholder="例: 163.50"
        oninput="saveSettings(); recalcAll()">
    </div>
    <div>
      <label>GBP レート</label>
      <input type="number" id="rateGBP" step="0.0001" placeholder="例: 190.00"
        oninput="saveSettings(); recalcAll()">
    </div>
  </div>

  <div style="display:flex; gap:8px; align-items:center;">
    <label style="margin:0; white-space:nowrap; line-height:2.2;">端数処理:</label>
    <select id="rounding" style="margin-bottom:0;" onchange="saveSettings(); recalcAll()">
      <option value="round">四捨五入</option>
      <option value="ceil">切り上げ</option>
      <option value="floor">切り捨て</option>
    </select>
  </div>
</div>

<!-- 明細入力 -->

  <h3>📋 明細入力</h3>
  <div id="groupList"></div>
  <button class="btn-success btn-full" onclick="addGroup()">＋ 国を追加</button>
</div>

<!-- 合計 -->

  <div id="totalArea" class="total-area">

  </div>
  <div style="display:flex; gap:5px; margin-top:10px; flex-wrap:wrap;">
    <button class="btn-primary"   style="flex:1;" onclick="recalcAll()">再計算</button>
    <button class="btn-secondary" onclick="window.print()">🖨️ 印刷</button>
    <button class="btn-danger"    onclick="clearAll()">全クリア</button>
  </div>
</div>

<!-- コピー用テキスト -->

<script>

let groupCount      = 0;
let currentRateType = "TTS";
let currentAgency   = "local";

// =========================
// localStorage 保存・復元
// =========================
function saveSettings() {
  localStorage.setItem("rateUSD",  document.getElementById("rateUSD").value);
  localStorage.setItem("rateEUR",  document.getElementById("rateEUR").value);
  localStorage.setItem("rateGBP",  document.getElementById("rateGBP").value);

function loadSettings() {
  const usd      = localStorage.getItem("rateUSD");
  const eur      = localStorage.getItem("rateEUR");
  const gbp      = localStorage.getItem("rateGBP");
  const rounding = localStorage.getItem("rounding");
  const rateType = localStorage.getItem("rateType");
  const agency   = localStorage.getItem("agency");
  const date     = localStorage.getItem("date");
  if (usd)      document.getElementById("rateUSD").value  = usd;
  if (eur)      document.getElementById("rateEUR").value  = eur;
  if (gbp)      document.getElementById("rateGBP").value  = gbp;
  if (rounding) document.getElementById("rounding").value = rounding;
  if (rateType) selectRateType(rateType);
  if (agency)   selectAgency(agency);
  if (date)     document.getElementById("date").value     = date;
}

window.addEventListener("load", loadSettings);

// =========================
// 依頼先選択
// =========================
function selectAgency(agency) {
  currentAgency = agency;
  document.getElementById("tab-local").classList.toggle("active", agency === "local");
  document.getElementById("tab-sgs").classList.toggle("active",   agency === "sgs");

  localStorage.setItem("agency", agency);
  for (let i = 1; i <= groupCount; i++) {
    if (document.getElementById(`group-${i}`)) rebuildCountrySelect(i);
  }
}

// =========================
// レート種別選択
// =========================
function selectRateType(type) {
  currentRateType = type;
  ["TTS","TTB","TTM"].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle("active", t === type);
  });
  const labelMap = { TTS: "TTS（売レート）", TTB: "TTB（買レート）", TTM: "TTM（仲値）" };
  document.getElementById("rateTypeLabel").textContent = `適用レート：${labelMap[type]}`;
  localStorage.setItem("rateType", type);
}

// =========================
// 日付を日本語形式に変換
// =========================
function formatDateJa(dateStr) {
  if (!dateStr) return "日付未入力";
  const [y, m, d] = dateStr.split("-").map(Number);
  return `${y}年${m}月${d}日`;
}

// =========================
// 祝日判定
// =========================
function isBaseHolidaySimple(date) {
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  if(m===1&&d===1)return true;
  if(y>=1967&&m===2&&d===11)return true;
  if(y>=2020&&m===2&&d===23)return true;
  if(y>=1989&&y<=2018&&m===12&&d===23)return true;
  if(y>=1989&&m===4&&d===29)return true;
  if(m===5&&d===3)return true;
  if(y>=2007&&m===5&&d===4)return true;
  if(m===5&&d===5)return true;
  if(y>=2016&&m===8&&d===11)return true;
  if(m===11&&d===3)return true;
  if(m===11&&d===23)return true;
  function getNthMonday(year,month,nth){
    const first=new Date(year,month-1,1);
    const offset=(1-first.getDay()+7)%7;
    return 1+offset+(nth-1)*7;
  }
  if(y>=2000&&m===1&&d===getNthMonday(y,1,2))return true;
  if(y>=2003&&m===7&&d===getNthMonday(y,7,3))return true;
  if(y>=2003&&m===9&&d===getNthMonday(y,9,3))return true;
  if(y>=2022&&m===10&&d===getNthMonday(y,10,2))return true;
  if(y===2020&&m===7&&d===24)return true;
  if(y===2021&&m===7&&d===23)return true;
  if(y>=1980&&y<=2099){
    const spring=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));
    if(m===3&&d===spring)return true;
    const autumn=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));
    if(m===9&&d===autumn)return true;
  }
  return false;
}
function isKokuminNoKyujitsu(date){
  const w=date.getDay();
  if(w===0||w===6)return false;
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  return isBaseHolidaySimple(new Date(y,m-1,d-1))&&isBaseHolidaySimple(new Date(y,m-1,d+1));
}
function isJapaneseHoliday(date){
  if(isBaseHolidaySimple(date))return true;
  if(isKokuminNoKyujitsu(date))return true;
  if(date.getDay()===0)return false;
  let check=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  for(let s=1;s<=7;s++){
    check.setDate(check.getDate()-1);
    const cw=check.getDay();
    if(cw===0)return isBaseHolidaySimple(check);
    if(!isBaseHolidaySimple(check)&&!isKokuminNoKyujitsu(check))return false;
  }
  return false;
}

// =========================
// 為替ページを開く
// =========================
function openRate(){
  const input=document.getElementById("date").value;
  if(!input){alert("日付を入力してください");return;}
  const[iy,im,id]=input.split("-").map(Number);
  let date=new Date(iy,im-1,id);
  const today=new Date();today.setHours(0,0,0,0);
  if(date>today){alert("未来の日付は指定できません");return;}
  let count=0;
  while(count<30){
    const w=date.getDay();
    if(w===0||w===6||isJapaneseHoliday(date)){date.setDate(date.getDate()-1);count++;}
    else break;
  }
  if(count>=30){alert("営業日の特定に失敗しました。");return;}
  const yy=String(date.getFullYear()).slice(-2);
  const mm=String(date.getMonth()+1).padStart(2,'0');
  const dd=String(date.getDate()).padStart(2,'0');
  if(count>0)alert("休業日のため "+date.getFullYear()+"-"+mm+"-"+dd+"（営業日）を表示します");
  window.open("https://www.murc-kawasesouba.jp/fx/past/index.php?id="+yy+mm+dd,"_blank");
}

// =========================
// ユーティリティ
// =========================
function getRate(currency){
  if(currency==="JPY")return 1;
  const el=document.getElementById("rate"+currency);
  if(!el)return null;
  const v=parseFloat(el.value);
  return(isNaN(v)||v<=0)?null:v;
}
function roundValue(v,mode){
  if(mode==="ceil")return Math.ceil(v);
  if(mode==="floor")return Math.floor(v);
  return Math.round(v);
}
function fmtF(cur,v){
  if(cur==="JPY")return v>0?`¥${Math.round(v).toLocaleString()}`:"-";
  return v>0?`${cur} ${v.toFixed(2)}`:"-";
}
function fmtJ(v,rate,rounding,isJPY){
  if(isJPY){
    if(v===0)return"-";
    return`${Math.round(v).toLocaleString()} 円`;
  }
  if(rate===null)return`<span style="color:#aaa;">-</span>`;
  if(v===0)return"-";
  return`${roundValue(v*rate,rounding).toLocaleString()} 円`;
}
function getCountriesForAgency(agency){
  return Object.keys(PRICE_TABLE[agency]);
}
function getMileageLabel(mileageType){
  if(mileageType==="km")    return "km";
  if(mileageType==="mile")  return "mile";
  if(mileageType==="perday")return "日";
  return "-";
}

function rebuildCountrySelect(gid){
  const sel=document.getElementById(`country-${gid}`);
  const current=sel.value;
  const countries=getCountriesForAgency(currentAgency);
  sel.innerHTML=`<option value="">-- 選択してください --</option>`;
  countries.forEach(c=>{
    const opt=document.createElement("option");
    opt.value=c; opt.textContent=c;
    if(c===current)opt.selected=true;
    sel.appendChild(opt);
  });
  if(current&&!countries.includes(current)){
    sel.value="";
    onCountryChange(gid);
  } else if(current&&countries.includes(current)){
    onCountryChange(gid);
  }
}

// =========================
// 国選択時の処理
// =========================
function onCountryChange(gid){
  const country=document.getElementById(`country-${gid}`).value;
  const infoEl =document.getElementById(`rateInfo-${gid}`);
  const secCont=document.getElementById(`section-contract-${gid}`);
  const secExp =document.getElementById(`section-expense-${gid}`);
  const subEl  =document.getElementById(`groupSubtotal-${gid}`);
  const titleEl=document.getElementById(`groupTitle-${gid}`);

  // 全行を一旦非表示
  [`row-mileage-${gid}`,`row-hotel-${gid}`,`row-transport-${gid}`].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.style.display="none";
  });

  if(!country||!PRICE_TABLE[currentAgency][country]){
    [infoEl,secCont,secExp,subEl].forEach(el=>el.style.display="none");
    titleEl.textContent="国を選択してください";
    recalcTotal();
    return;
  }

  const p    =PRICE_TABLE[currentAgency][country];
  const cur  =p.currency;
  const isJPY=(cur==="JPY");
  titleEl.textContent=`${country}　（${cur}）`;

  // 単価情報
  let mileageInfo="";
  if(p.mileageType==="km")      mileageInfo=`交通費(/km): <span>${p.mileage.toFixed(2)}</span>`;
  else if(p.mileageType==="mile")   mileageInfo=`交通費(/mile): <span>${p.mileage.toFixed(2)}</span>`;
  else if(p.mileageType==="perday") mileageInfo=`交通費(/day): <span>${p.mileage.toFixed(2)}</span>`;
  else                              mileageInfo=`交通費: <span>実費</span>`;

  const mandayDisp=isJPY?`¥${p.manday.toLocaleString()}`:`${cur} ${p.manday.toFixed(2)}`;
  const hourlyDisp=isJPY?`¥${p.hourly.toLocaleString()}`:`${cur} ${p.hourly.toFixed(2)}`;

  infoEl.style.display="block";
  infoEl.innerHTML=
    `通貨: <span>${cur}</span> ／ `+
    `技術料単価: <span>${mandayDisp}</span> ／ `+
    `時間外単価(/H): <span>${hourlyDisp}</span> ／ `+
    mileageInfo;

  document.getElementById(`price-manday-${gid}`).textContent  =mandayDisp;
  document.getElementById(`price-overtime-${gid}`).textContent=hourlyDisp;

  secCont.style.display="block";
  subEl.style.display  ="block";

  // 走行費行
  if(p.mileageType==="km"||p.mileageType==="mile"||p.mileageType==="perday"){
    document.getElementById(`row-mileage-${gid}`).style.display="";
    document.getElementById(`unit-mileage-${gid}`).textContent=getMileageLabel(p.mileageType);
    const priceDisp=isJPY?`¥${p.mileage.toLocaleString()}`:`${cur} ${p.mileage.toFixed(2)}`;
    document.getElementById(`price-mileage-${gid}`).textContent=priceDisp;
  }

  // 実費精算セクション（at cost または Japan）
  if(p.mileageType==="atcost"){
    secExp.style.display="block";
    const curDisp=isJPY?"JPY":cur;
    document.getElementById(`row-hotel-${gid}`).style.display="";
    document.getElementById(`cur-hotel-${gid}`).textContent=curDisp;
    document.getElementById(`row-transport-${gid}`).style.display="";
    document.getElementById(`cur-transport-${gid}`).textContent=curDisp;
  } else {
    secExp.style.display="none";
  }

  calcGroup(gid);
}

// =========================
// グループ計算
// =========================
function calcGroup(gid){
  const country=document.getElementById(`country-${gid}`).value;
  if(!country||!PRICE_TABLE[currentAgency][country]){recalcTotal();return;}

  const p       =PRICE_TABLE[currentAgency][country];
  const cur     =p.currency;
  const isJPY   =(cur==="JPY");
  const rounding=document.getElementById("rounding").value;
  const rate    =getRate(cur);

  const manday  =parseFloat(document.getElementById(`manday-${gid}`).value)  ||0;
  const overtime=parseFloat(document.getElementById(`overtime-${gid}`).value)||0;
  const sMandayF  =manday  *p.manday;
  const sOvertimeF=overtime*p.hourly;

  document.getElementById(`sub-manday-f-${gid}`).textContent  =fmtF(cur,sMandayF);
  document.getElementById(`sub-overtime-f-${gid}`).textContent=fmtF(cur,sOvertimeF);
  document.getElementById(`sub-manday-j-${gid}`).innerHTML  =fmtJ(sMandayF,  rate,rounding,isJPY);
  document.getElementById(`sub-overtime-j-${gid}`).innerHTML=fmtJ(sOvertimeF,rate,rounding,isJPY);

  let sMileageF=0;
  if(p.mileageType==="km"||p.mileageType==="mile"||p.mileageType==="perday"){
    const mileage=parseFloat(document.getElementById(`mileage-${gid}`).value)||0;
    sMileageF=mileage*p.mileage;
    document.getElementById(`sub-mileage-f-${gid}`).textContent=fmtF(cur,sMileageF);
    document.getElementById(`sub-mileage-j-${gid}`).innerHTML  =fmtJ(sMileageF,rate,rounding,isJPY);
  }

  const contractTotal=sMandayF+sOvertimeF+sMileageF;
  let expenseTotal=0;

  const hotelEl=document.getElementById(`row-hotel-${gid}`);
  let sHotelF=0;
  if(hotelEl&&hotelEl.style.display!=="none"){
    sHotelF=parseFloat(document.getElementById(`hotel-${gid}`).value)||0;
    expenseTotal+=sHotelF;
    document.getElementById(`sub-hotel-f-${gid}`).textContent=fmtF(cur,sHotelF);
    document.getElementById(`sub-hotel-j-${gid}`).innerHTML  =fmtJ(sHotelF,rate,rounding,isJPY);
  }

  const transportEl=document.getElementById(`row-transport-${gid}`);
  let sTransportF=0;
  if(transportEl&&transportEl.style.display!=="none"){
    sTransportF=parseFloat(document.getElementById(`transport-${gid}`).value)||0;
    expenseTotal+=sTransportF;
    document.getElementById(`sub-transport-f-${gid}`).textContent=fmtF(cur,sTransportF);
    document.getElementById(`sub-transport-j-${gid}`).innerHTML  =fmtJ(sTransportF,rate,rounding,isJPY);
  }

  const grandForeign=contractTotal+expenseTotal;
  const subEl=document.getElementById(`groupSubtotal-${gid}`);

  let html;
  if(isJPY){
    html=`合計: <span style="color:#0056b3;">¥${Math.round(grandForeign).toLocaleString()}</span>`;
    html+=` → <span class="jpy">${Math.round(grandForeign).toLocaleString()} 円</span>`;
  } else {
    html=`合計: <span style="color:#0056b3;">${cur} ${grandForeign.toFixed(2)}</span>`;
    if(rate!==null){
      const jpy=roundValue(grandForeign*rate,rounding);
      html+=` → <span class="jpy">${jpy.toLocaleString()} 円</span>`;
    } else {
      html+=` <span style="color:#999;">（${cur}レートを入力してください）</span>`;
    }
  }
  subEl.innerHTML=html;
  recalcTotal();
}

// =========================
// 全体合計
// =========================
function recalcAll(){
  for(let i=1;i<=groupCount;i++){
    if(document.getElementById(`group-${i}`))calcGroup(i);
  }
}

function recalcTotal(){
  const rounding =document.getElementById("rounding").value;
  const totalArea=document.getElementById("totalArea");
  const foreignSums={};
  let hasAny=false;

  for(let i=1;i<=groupCount;i++){
    const el=document.getElementById(`group-${i}`);
    if(!el)continue;
    const country=document.getElementById(`country-${i}`).value;
    if(!country||!PRICE_TABLE[currentAgency][country])continue;
    const p  =PRICE_TABLE[currentAgency][country];
    const cur=p.currency;
    const isJPY=(cur==="JPY");

    const manday  =parseFloat(document.getElementById(`manday-${i}`).value)  ||0;
    const overtime=parseFloat(document.getElementById(`overtime-${i}`).value)||0;
    let total=manday*p.manday+overtime*p.hourly;

    if(p.mileageType==="km"||p.mileageType==="mile"||p.mileageType==="perday"){
      total+=(parseFloat(document.getElementById(`mileage-${i}`).value)||0)*p.mileage;
    }
    const hotelEl=document.getElementById(`row-hotel-${i}`);
    if(hotelEl&&hotelEl.style.display!=="none"){
      total+=parseFloat(document.getElementById(`hotel-${i}`).value)||0;
    }
    const transportEl=document.getElementById(`row-transport-${i}`);
    if(transportEl&&transportEl.style.display!=="none"){
      total+=parseFloat(document.getElementById(`transport-${i}`).value)||0;
    }

    const key=isJPY?"JPY":cur;
    foreignSums[key]=(foreignSums[key]||0)+total;
    hasAny=true;
  }

  if(!hasAny){
    totalArea.innerHTML=`<div class="total-row" style="color:#888;">明細を追加してください</div>`;
    return;
  }

  let html="";
  let grandTotal  =0;
  let allConverted=true;

  for(const[cur,sum]of Object.entries(foreignSums)){
    if(cur==="JPY"){
      grandTotal+=Math.round(sum);
      html+=`<div class="total-row"><span>¥${Math.round(sum).toLocaleString()}</span><span>${Math.round(sum).toLocaleString()} 円</span></div>`;
    } else {
      const rate=getRate(cur);
      if(rate!==null){
        const jpy=roundValue(sum*rate,rounding);
        grandTotal+=jpy;
        html+=`<div class="total-row"><span>${cur} ${sum.toFixed(2)}</span><span>${jpy.toLocaleString()} 円</span></div>`;
      } else {
        allConverted=false;
        html+=`<div class="total-row"><span>${cur} ${sum.toFixed(2)}</span><span style="color:#999;">${cur} レート未入力</span></div>`;
      }
    }
  }
  html+=allConverted
    ?`<div class="total-row grand"><span>合計</span><span>${grandTotal.toLocaleString()} 円</span></div>`
    :`<div class="total-row grand" style="color:#999;"><span>合計</span><span>レートを全て入力してください</span></div>`;
  totalArea.innerHTML=html;
}

function makeDivider(area,text){
  const div=document.createElement("div");
  div.className="copy-line-divider";
  div.textContent=text;
  area.appendChild(div);
}

function makeSingleRow(area,text){
  const row=document.createElement("div");
  row.className="copy-line-row";
  const inp=document.createElement("input");
  inp.type="text"; inp.className="copy-line-input";
  inp.value=text; inp.readOnly=true;
  inp.addEventListener("click",function(){ this.select(); });
  inp.addEventListener("focus",function(){ this.select(); });
  const btn=document.createElement("button");
  btn.className="copy-line-btn"; btn.textContent="📋";
  btn.addEventListener("click",function(){ copyLine(inp,btn); });
  row.appendChild(inp); row.appendChild(btn);
  area.appendChild(row);
}

function makeSplitRow(area,textForeign,textJpy){
  const row=document.createElement("div");
  row.className="copy-line-row-split";

  const colF=document.createElement("div"); colF.className="col-foreign";
  const lblF=document.createElement("span"); lblF.className="col-label foreign"; lblF.textContent="外貨";
  const inpF=document.createElement("input");
  inpF.type="text"; inpF.className="copy-line-input"; inpF.value=textForeign; inpF.readOnly=true;
  inpF.addEventListener("click",function(){ this.select(); });
  inpF.addEventListener("focus",function(){ this.select(); });
  const btnF=document.createElement("button");
  btnF.className="copy-line-btn"; btnF.textContent="📋";
  btnF.addEventListener("click",function(){ copyLine(inpF,btnF); });
  colF.appendChild(lblF); colF.appendChild(inpF); colF.appendChild(btnF);

  const colJ=document.createElement("div"); colJ.className="col-jpy";
  const lblJ=document.createElement("span"); lblJ.className="col-label jpy"; lblJ.textContent="円換算";
  const inpJ=document.createElement("input");
  inpJ.type="text"; inpJ.className="copy-line-input";
  inpJ.value=textJpy!==null?textJpy:"レート未入力"; inpJ.readOnly=true;
  if(textJpy===null)inpJ.style.color="#aaa";
  inpJ.addEventListener("click",function(){ this.select(); });
  inpJ.addEventListener("focus",function(){ this.select(); });
  const btnJ=document.createElement("button");
  btnJ.className="copy-line-btn"; btnJ.textContent="📋";
  if(textJpy===null){ btnJ.disabled=true; btnJ.style.opacity="0.4"; }
  btnJ.addEventListener("click",function(){ copyLine(inpJ,btnJ); });
  colJ.appendChild(lblJ); colJ.appendChild(inpJ); colJ.appendChild(btnJ);

  row.appendChild(colF); row.appendChild(colJ);
  area.appendChild(row);
}

// =========================
// コピー行リストの生成
// =========================
function generateCopyLines(){
  const dateStr =document.getElementById("date").value;
  const dateJa  =formatDateJa(dateStr);
  const rounding=document.getElementById("rounding").value;

  const usedCurrencies=new Set();
  let hasAny=false;
  for(let i=1;i<=groupCount;i++){
    const el=document.getElementById(`group-${i}`);
    if(!el)continue;
    const country=document.getElementById(`country-${i}`).value;
    if(!country||!PRICE_TABLE[currentAgency][country])continue;
    const cur=PRICE_TABLE[currentAgency][country].currency;
    if(cur!=="JPY")usedCurrencies.add(cur);
    hasAny=true;
  }

  if(!hasAny){ alert("明細を入力してください。"); return; }

  const area=document.getElementById("copyLinesArea");
  area.innerHTML="";

  const header=document.createElement("div");
  header.className="copy-line-header";
  header.textContent="▼ 欄をクリックで全選択 → Ctrl+C（Mac: ⌘+C）でコピー　または　📋ボタンで即コピー";
  area.appendChild(header);

  // 換算レート
  makeDivider(area,"【換算レート】");
  let anyRate=false;
  for(const cur of usedCurrencies){
    const rate=getRate(cur);
    if(rate!==null){
      makeSingleRow(area,`換算レート${currentRateType}：${dateJa}　¥${rate.toFixed(2)}/${cur}`);
      anyRate=true;
    }
  }
  if(!anyRate&&usedCurrencies.size>0) makeDivider(area,"（レート未入力）");
  if(usedCurrencies.size===0)         makeDivider(area,"（JPY建てのため換算レート不要）");

  // 明細
  for(let i=1;i<=groupCount;i++){
    const el=document.getElementById(`group-${i}`);
    if(!el)continue;
    const country=document.getElementById(`country-${i}`).value;
    if(!country||!PRICE_TABLE[currentAgency][country])continue;

    const p   =PRICE_TABLE[currentAgency][country];
    const cur =p.currency;
    const isJPY=(cur==="JPY");
    const rate=getRate(cur);

    makeDivider(area,`▼ ${country}（${cur}）`);

    function jpyText(v){
      if(isJPY)return v===0?"-":`${Math.round(v).toLocaleString()} 円`;
      if(rate===null)return null;
      if(v===0)return"-";
      return`${roundValue(v*rate,rounding).toLocaleString()} 円`;
    }
    function fmtForeign(v){
      if(isJPY)return v>0?`¥${Math.round(v).toLocaleString()}`:"-";
      return v>0?`${cur}${v.toFixed(2)}`:"-";
    }

    // 協定単価
    makeDivider(area,"【協定単価】");
    const manday  =parseFloat(document.getElementById(`manday-${i}`).value)  ||0;
    const overtime=parseFloat(document.getElementById(`overtime-${i}`).value)||0;
    const sMandayF  =manday  *p.manday;
    const sOvertimeF=overtime*p.hourly;
    const mandayPrice=isJPY?`¥${p.manday.toLocaleString()}`:`${cur}${p.manday.toFixed(2)}`;
    const hourlyPrice=isJPY?`¥${p.hourly.toLocaleString()}`:`${cur}${p.hourly.toFixed(2)}`;

    if(manday>0)
      makeSplitRow(area,
        `技術料：${mandayPrice} x ${manday}日 = ${fmtForeign(sMandayF)}`,
        jpyText(sMandayF));
    if(overtime>0)
      makeSplitRow(area,
        `時間外：${hourlyPrice} x ${overtime}H = ${fmtForeign(sOvertimeF)}`,
        jpyText(sOvertimeF));

    if(p.mileageType==="km"||p.mileageType==="mile"||p.mileageType==="perday"){
      const mileage=parseFloat(document.getElementById(`mileage-${i}`).value)||0;
      if(mileage>0){
        const sMileageF=mileage*p.mileage;
        const unitLbl=getMileageLabel(p.mileageType);
        const mileagePrice=isJPY?`¥${p.mileage.toLocaleString()}`:`${cur}${p.mileage.toFixed(2)}`;
        makeSplitRow(area,
          `交通費：${mileagePrice} x ${mileage}${unitLbl} = ${fmtForeign(sMileageF)}`,
          jpyText(sMileageF));
      }
    }

    // 実費精算
    const hotelEl    =document.getElementById(`row-hotel-${i}`);
    const transportEl=document.getElementById(`row-transport-${i}`);
    const sHotelF    =hotelEl&&hotelEl.style.display!=="none"?(parseFloat(document.getElementById(`hotel-${i}`).value)||0):0;
    const sTransportF=transportEl&&transportEl.style.display!=="none"?(parseFloat(document.getElementById(`transport-${i}`).value)||0):0;

    if(sHotelF>0||sTransportF>0){
      makeDivider(area,"【実費精算】");
      if(sHotelF>0)
        makeSplitRow(area,`宿泊費：${fmtForeign(sHotelF)}（実費）`,jpyText(sHotelF));
      if(sTransportF>0)
        makeSplitRow(area,`交通費：${fmtForeign(sTransportF)}（実費）`,jpyText(sTransportF));
    }
  }

  area.style.display="block";
}

// =========================
// 1行コピー処理
// =========================
function copyLine(inputEl,btnEl){
  const text=inputEl.value;
  const showFlash=()=>{
    inputEl.classList.add("copied");
    btnEl.textContent="✅";
    const msg=document.getElementById("copySuccess");
    msg.style.display="inline";
    setTimeout(()=>{
      inputEl.classList.remove("copied");
      btnEl.textContent="📋";
      msg.style.display="none";
    },1500);
  };
  navigator.clipboard.writeText(text).then(showFlash).catch(()=>{
    inputEl.select();
    document.execCommand("copy");
    showFlash();
  });
}

// =========================
// グループ削除・全クリア
// =========================
function removeGroup(gid){
  const el=document.getElementById(`group-${gid}`);
  if(el)el.remove();
  recalcTotal();
}

function clearAll(){
  if(!confirm("全ての明細とレートをクリアしますか？"))return;
  document.getElementById("groupList").innerHTML="";
  ["rateUSD","rateEUR","rateGBP"].forEach(id=>{document.getElementById(id).value="";});
  document.getElementById("copyLinesArea").style.display="none";
  document.getElementById("copyLinesArea").innerHTML="";
  ["rateUSD","rateEUR","rateGBP","rounding","rateType","date","agency"].forEach(key=>{
    localStorage.removeItem(key);
  });
  document.getElementById("date").value="";
  groupCount=0;
  recalcTotal();
}

// =========================
// キー操作
// =========================
document.addEventListener("keydown",function(e){
  const tag=document.activeElement.tagName;
  const isInput=(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT");
  if(e.key==="Enter"&&!isInput)recalcAll();
  if(e.key==="Escape"){if(confirm("全クリアしますか？"))clearAll();}
});
</script>
